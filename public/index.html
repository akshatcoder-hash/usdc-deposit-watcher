<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>USDC watcher</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/dashboard.css" />
    <link rel="stylesheet" href="/machine.css" />
    <script src="/machine.js" defer></script>
    <script src="/dashboard.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to dashboard</a>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>USDC watcher</h1>
          <span class="network" id="network">—</span>
        </div>
        <div class="top-actions">
          <span class="connection" id="connection"
            ><span class="dot" aria-hidden="true"></span
            ><span id="connection-label">Connecting</span></span
          ><button id="theme" class="quiet">Dark mode</button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div id="notice" class="notice" role="status" hidden></div>
        <noscript
          ><p class="notice">
            Enable JavaScript to see live balances.
          </p></noscript
        >
        <section class="overview" aria-label="Wallet balance">
          <div>
            <h2>Balance</h2>
            <div class="amount">
              <span id="balance">—</span><span class="currency">USDC</span>
            </div>
            <p class="small muted" id="balance-status" role="status" hidden>
              Balance unavailable. Retrying…
            </p>
          </div>
          <div class="wallet">
            <a
              id="wallet"
              class="wallet-address"
              aria-label="Wallet in Solana Explorer"
              >Loading address…</a
            ><button id="copy" class="quiet" disabled>Copy address</button>
          </div>
        </section>
        <section class="pipeline" aria-label="Deposit machine">
          <div class="machine" id="machine">
            <p id="machine-loading" class="small muted">Loading machine…</p>
          </div>
          <div class="machine-toolbar">
            <p class="small muted" id="machine-readout" role="status"></p>
            <div class="machine-actions">
              <button class="quiet" id="replay-animation" disabled>
                Replay animation</button
              ><button id="drop" class="quiet" disabled>
                Drop stream · 30s
              </button>
            </div>
          </div>
          <ul class="machine-legend" aria-label="Machine destinations">
            <li><span class="result credited">Credited</span></li>
            <li><span class="result duplicate">Skipped</span></li>
            <li><span class="result ignored">Ignored</span></li>
          </ul>
        </section>
        <section class="activity" aria-labelledby="activity-title">
          <div class="section-head">
            <h2 id="activity-title">Activity</h2>
            <button class="quiet" id="pause" aria-pressed="false">
              Pause updates
            </button>
          </div>
          <table>
            <caption class="sr-only">
              Recent transactions
            </caption>
            <thead>
              <tr>
                <th scope="col">Transaction</th>
                <th scope="col" class="numeric">USDC</th>
                <th scope="col">Result</th>
              </tr>
            </thead>
            <tbody id="transactions">
              <tr>
                <td colspan="3" class="empty">Loading…</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
  </body>
</html>
